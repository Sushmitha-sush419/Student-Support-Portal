<!DOCTYPE html>
<html>
<head>
    <title>Lost & Found Portal</title>

    <style>
        body{
            margin:0;
            font-family: Arial;
            text-align:center;

            background:
            linear-gradient(
            135deg,
rgba(147, 197, 253, 0.35),
rgba(59, 130, 246, 0.35)
            ),
            url('https://wp.classlawgroup.com/wp-content/uploads/2015/07/bigstock-Magnify-Glass-Blue-Grunge-16041161-1600.jpg');

            background-size: cover;
            background-position: center;
            height:90vh;
            color:white;
        }
        .headline {
  font-size: 4rem;
   color: white;
   text-shadow: 2px 2px 4px #000000;
  font-weight: bold;
  text-align: center;
  font-weight: bold;
  font-family: Arial Sans Serif;
}

        .back-home{
            position:absolute;
            top:15px;
            left:15px;
            font-size:14px;
        }

        .back-home a{
            color:white;
            text-decoration:none;
            background:#0F52BA;
            padding:8px 14px;
            border-radius:6px;
        }

        h1{
            padding-top:40px;
            font-size:55px;
        }

        .buttons{
            margin-top:40px;
        }

        .buttons a{
            text-decoration:none;
        }

        .buttons button{
            padding:12px 22px;
            margin:10px;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            color: black;
        }

        .section-links{
            margin-top:50px;
        }

        .section-links a{
            display:block;
            text-decoration:none;
            color: white;
            text-shadow: 2px 2px 2px #000000;
            font-size:28px;
            font-weight:bold;
            margin:40px;
        }

        .section-links a:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

    <div class="back-home">
        <a href="/home">⬅ Back to Home</a>
    </div>

    <h1 class="headline">Lost & Found Portal</h1>

    <div class="buttons">

        <a href="/lost">
            <button>Report Lost Item</button>
        </a>

        <a href="/found">
            <button>Report Found Item</button>
        </a>

    </div>

    <div class="section-links">

        <a href="/view">
            🔍 Lost Items
        </a>

        <a href="/view_found">
            📦 Found Items
        </a>

    </div>

</body>
</html>
