<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, rgba(147, 197, 253, 0.35), rgba(59, 130, 246, 0.35)),
                        url('https://wp.classlawgroup.com/wp-content/uploads/2015/07/bigstock-Magnify-Glass-Blue-Grunge-16041161-1600.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding: 30px;
        }

        .back-home {
            position: absolute;
            top: 15px;
            left: 15px;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            background: #0F52BA;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-container {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
        }

        .form-container h2 { margin-bottom: 20px; text-shadow: 1px 1px 2px #000; }

        .form-container label { display: block; margin-top: 15px; text-align: left; margin-left: 5%; }

        .form-container input, .form-container textarea {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        .form-container textarea { height: 80px; resize: vertical; }

        .form-container button {
            padding: 12px 25px;
            background: #0F52BA;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        .form-container button:hover { background: #0b3d8a; }

        .secret-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="back-home">
    <a href="/view_found">⬅ Back to Found-items</a>
</div>

<div class="form-container">
    <h2>Claim Item</h2>

    <div style="background: rgba(0,0,0,0.3); padding:10px; margin-bottom:20px; border-radius:10px;">
        <p><strong>Claiming:</strong> {{ item_name }}</p>
    </div>

    <form method="POST">
       <label><b>Your Name:</b></label>
       <input type="text" name="name" required>

       <label><b>Your Contact (Phone/Email):</b></label>
       <input type="text" name="contact" required>

       <label><b>Describe the item (Proof of ownership):</b></label>
       <textarea name="proof" placeholder="e.g., The item has a blue sticker on the back..." required></textarea>

       <label><b>Secret Question:</b></label>
       <div class="secret-box">
           <p style="color: #e0f2fe; margin: 0;">{{ secret_question }}</p>
       </div>
       <input type="text" name="secret" placeholder="Enter answer here" required>

       <button type="submit">Submit Claim</button>
   </form>
</div>

</body>
</html>
