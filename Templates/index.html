<!DOCTYPE html>
<html>
<head>
<title>Academic AI Chatbot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

height:100vh;

padding:15px;

/* Background image */
background:url("/static/images/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

}
.back-home{
            position:absolute;
            top:3px;
            left:11px;
            font-size:13px;
        }

/* Main transparent container */

.chat-wrapper{

width:95%;

height:95vh;

margin:auto;

background:rgba(17,17,17,.45);

backdrop-filter:blur(15px);

-webkit-backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.1);

border-radius:25px;

display:flex;

flex-direction:column;

overflow:hidden;

box-shadow:
0 8px 32px rgba(0,0,0,.4);

}


/* Header */

.header{

padding:20px;

font-size:24px;

font-weight:bold;

color:white;

background:rgba(0,0,0,.25);

border-bottom:
1px solid rgba(255,255,255,.1);

}

.header::before{

content:"🤖 ";

}


/* Chat Area */

.chat-container{

flex:1;

overflow-y:auto;

padding:25px;

}


/* Message Common */

.msg{

max-width:75%;

padding:16px;

margin:15px 0;

border-radius:18px;

line-height:1.8;

font-size:18px;

white-space:pre-line;

word-wrap:break-word;

animation:fade .3s;

}


/* User */

.user{

margin-left:auto;

background:
linear-gradient(
45deg,
#ff44cc,
#9900ff
);

color:white;

border-bottom-right-radius:5px;

}


/* Bot */

.bot{

background:
rgba(255,255,255,.08);

color:white;

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.08);

border-bottom-left-radius:5px;

}


/* Input area */

.input-box{

display:flex;

padding:20px;

background:rgba(0,0,0,.25);

border-top:
1px solid rgba(255,255,255,.1);

}


/* Input */

input{

flex:1;

padding:18px;

background:
rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.1);

outline:none;

color:white;

border-radius:35px;

font-size:17px;

}

input::placeholder{

color:#ddd;

}


/* Button */

button{

width:70px;

margin-left:12px;

border:none;

border-radius:50%;

background:#cc00ff;

color:white;

font-size:22px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}


/* animation */

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* Scrollbar */

::-webkit-scrollbar{

width:5px;

}

::-webkit-scrollbar-thumb{

background:#888;

border-radius:20px;

}

</style>
</head>


<body>
<div class="back-home">
        <a href="/home">⬅ Back</a>
    </div>

<div class="chat-wrapper">

<div class="header">

Academic AI Chatbot

</div>


<div
id="chat"
class="chat-container">

</div>


<div class="input-box">

<input
id="msg"
placeholder="Ask academic question..."
>

<button
onclick="send()">

➤

</button>

</div>

</div>


<script>

function addMessage(text, cls){

let div=document.createElement("div");

div.className=
"msg "+cls;

div.innerText=text;

document
.getElementById("chat")
.appendChild(div);

document
.getElementById("chat")
.scrollTop=
document
.getElementById("chat")
.scrollHeight;

}


function send(){

let msg=
document
.getElementById("msg")
.value.trim();

if(!msg)return;


addMessage(
msg,
"user"
);


let loading=
document.createElement(
"div"
);

loading.className=
"msg bot";

loading.innerText=
"Typing...";


document
.getElementById(
"chat"
)
.appendChild(
loading
);


fetch("/chat",{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

message:msg

})

})

.then(res=>res.json())

.then(data=>{

loading.innerText=
data.reply;

})

.catch(()=>{

loading.innerText=
"Server error";

});


document
.getElementById(
"msg"
).value="";

document
.getElementById(
"msg"
).focus();

}



const inputBox=
document.getElementById(
"msg"
);


inputBox
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

e.preventDefault();

send();

}

});


window.onload=
function(){

addMessage(

"Hello 👋\nI am your Academic AI Assistant.\nAsk any question.",

"bot"

)

}

</script>

</body>
</html>
