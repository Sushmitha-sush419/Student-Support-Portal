<!DOCTYPE html>
<html>
<head>
    <title>Select Semester</title>
    <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                    url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .main-container {
        width: 100%;
        max-width: 900px;
        padding: 40px;
        border-radius: 24px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.25);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        text-align: center;
        position: relative;
    }

    .back-btn {
        position: absolute;
        top: 25px;
        left: 25px;
        text-decoration: none;
        background: #38bdf8;
        color: white;
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        transition: 0.3s;
    }
    .back-btn:hover { background: #0ea5e9; transform: scale(1.05); }

    h1 {
        color: white;
        font-size: 40px;
        margin-bottom: 50px;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .course-box { margin-bottom: 50px; }
    .course-title {
        font-size: 26px;
        color: white;
        margin-bottom: 25px;
        font-weight: 700;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    }

    .semester-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
    }

    .semester-card {
        background: linear-gradient(135deg, #38bdf8, #7dd3fc);
        padding: 20px;
        border-radius: 20px;
        text-decoration: none;
        color: #0f172a;
        font-weight: 700;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .semester-card:hover {
        transform: translateY(-5px);
        background: white;
        color: #0ea5e9;
    }
    </style>
</head>

<body>

<div class="main-container">
    <a href="/study" class="back-btn">⬅ Back to Home</a>

    <h1>{{ material_type }}</h1>

    {% for course in courses %}
    <div class="course-box">
        <div class="course-title">{{ course }}</div>
        <div class="semester-grid">
            {% for sem in range(1,7) %}
            <a class="semester-card"
               href="/subjects/{{ material_type }}/{{ course }}/Semester {{ sem }}">
               Semester {{ sem }}
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
